# Single startup configuration for model, controller and downstream prediction.
# SI units; drive speed rad/s, drive acceleration rad/s^2.
geometry:
  wheelbase: 0.6
  track_width: 0.5
  wheel_radius: 0.1
  wheel_width: 0.05
  body_length: 0.8
  body_width: 0.28
  body_height: 0.16
  ground_clearance: 0.14
  body_mass: 20.0
  wheel_mass: 0.6
  steering_mass: 0.2
control:
  update_rate: 100.0
  cmd_timeout: 0.5
  wall_timeout: 0.5
  feedback_timeout: 0.25
  max_wheel_speed: 20.0
  max_wheel_acceleration: 40.0
  max_steering_rate: 2.5
  steering_limit: 1.5707963267948966
  max_linear_speed: 0.8
  max_angular_speed: 0.8
  max_linear_acceleration: 0.9
  max_angular_acceleration: 1.3
  stopped_wheel_speed: 0.05
  publish_odom: true
  odom_topic: odom
  publish_odom_tf: true
  odom_frame: ''
  odom_child_frame: ''
  pose_variance: 0.02
  twist_variance: 0.02
  steering_tracking_tolerance: 0.05
  command_type: stamped
