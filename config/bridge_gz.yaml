# Complete configuration for the single generic bridge node.
# Add other Gazebo/ROS topic mappings (e.g. sensors) to this list.
# Absolute topic names stay global; relative names expand under the robot namespace.
# Odometry is computed by controller.py, so no ground-truth odometry is bridged.
- topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
