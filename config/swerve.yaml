# Startup-only model and chassis configuration. Unknown or missing keys are errors.
# No planner, path, obstacle or algorithm settings belong in this file.
geometry:
  # Front-to-rear steering-axis separation; must exceed twice wheel_radius.
  wheelbase: 0.60
  # Left-to-right steering-axis separation. Must exceed body_width +
  # 2 * wheel_radius so the finite-angle steering wheel sweep clears the body.
  track_width: 0.50
  # Rolling radius used for both the cylinder model and wheel/body conversions.
  wheel_radius: 0.10
  # Wheel cylinder thickness along its axle; affects shape and inertia.
  wheel_width: 0.05
  # Chassis box dimensions along x (forward), y (left), z (up).
  body_length: 0.80
  body_width: 0.28
  body_height: 0.16
  # Nominal chassis underside height above ground, before any launch z offset.
  ground_clearance: 0.14
  # Chassis mass and individual wheel / steering-link masses, not total mass.
  # Inertias are derived from the corresponding primitive shapes.
  body_mass: 20.0
  wheel_mass: 0.6
  steering_mass: 0.2

control:
  # Fixed ros2_control update frequency; bundled physics runs at 200 Hz.
  update_rate: 100.0
  # Maximum command age in simulation time and silence in steady wall time (s).
  # Expiry latches a fault, commands zero wheels and holds measured steering.
  cmd_timeout: 0.5
  wall_timeout: 0.5
  # Encoder odometry maximum observation gap/age (s).
  feedback_timeout: 0.25
  # Drive joint angular limits: rad/s and rad/s^2. Normal braking uses this ramp.
  max_wheel_speed: 20.0
  max_wheel_acceleration: 40.0
  # Steering command slew (rad/s) and mechanical travel (+/-rad).
  max_steering_rate: 2.5
  steering_limit: 1.5707963267948966
  # Body target limits (m/s, rad/s) and target slew (m/s^2, rad/s^2).
  # These bound requested twist; actual acceleration also depends on steering,
  # contact and actuator response. They are not measured physical guarantees.
  max_linear_speed: 0.8
  max_angular_speed: 0.8
  max_linear_acceleration: 0.9
  max_angular_acceleration: 1.3
  # Larger steering changes stop and align; smaller changes may occur while moving.
  drive_steering_limit: 0.2
  # All measured joints must stay within this angular error for this dwell (s).
  steering_alignment_tolerance: 0.05
  steering_alignment_duration: 0.05
  # Whole braking/alignment timeout (s), never renewed by repeated requests.
  mode_switch_timeout: 5.0
  # Measured wheel stop threshold (rad/s). Encoder stop does not detect body slip.
  stopped_wheel_speed: 0.05
  # Odometry and TF switches are independent; integration always continues.
  publish_odom: true
  odom_topic: odom
  publish_odom_tf: true
  # Empty frame names resolve to <prefix>odom and <prefix>base_footprint.
  # Overrides rename frames only; they perform no coordinate transformation.
  odom_frame: ""
  odom_child_frame: ""
  # Fixed x/y/yaw covariance diagonals, not sensor noise or calibrated uncertainty.
  pose_variance: 0.02
  twist_variance: 0.02
